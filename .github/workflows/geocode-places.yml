name: Restoran konumlarını çıkar (tek seferlik)

on:
  push:
    branches: [claude/konum-verisi]

permissions:
  contents: write

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node --experimental-strip-types tools/geocode-places.mts
      - name: Sonucu dala kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/placeCoords.json
          git commit -m "Restoran konumları (OpenStreetMap)" || echo "değişiklik yok"
          git push
