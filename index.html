<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8F9FA" />
    <title>Kaydırak – Seç. Kaydır. Ye.</title>
    <meta name="description" content="Bugün ne yesek? Menülerde kaybolma: seç, kaydır, ye. Kaydırarak karar ver, beğendiklerini arenada kapıştır." />
  </head>
  <body>
    <noscript>
      <div style="padding:32px 24px;font:17px/1.5 system-ui,sans-serif;color:#1D2D44">
        <h2 style="margin:0 0 12px">Kaydırak için JavaScript gerekli</h2>
        <p>Tarayıcında JavaScript kapalı. iPhone'da: Ayarlar → Uygulamalar → Safari → İleri Düzey → JavaScript'i aç, sonra sayfayı yenile.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script>
      // Web sürümü: uygulama açılamazsa beyaz ekran yerine sebebi göster.
      (function () {
        var shown = false;
        function show(msg) {
          if (shown) return;
          shown = true;
          var box = document.createElement("div");
          box.setAttribute("style", "position:fixed;inset:0;z-index:99999;background:#1D2D44;color:#fff;font:16px/1.5 system-ui,sans-serif;padding:32px 24px;overflow:auto");
          box.innerHTML = '<h2 style="margin:0 0 12px;font-size:22px">Kaydırak açılamadı</h2><p style="margin:0 0 16px">Sayfayı yenilemeyi dene. Düzelmezse bu ekranın görüntüsünü ekibe gönder.</p><pre style="white-space:pre-wrap;background:rgba(255,255,255,.1);padding:12px;border-radius:8px;font-size:13px"></pre><button style="margin-top:16px;padding:12px 20px;border:0;border-radius:999px;background:#E63946;color:#fff;font-size:16px">Yenile</button>';
          box.querySelector("pre").textContent = String(msg) + "\n\n" + navigator.userAgent;
          box.querySelector("button").onclick = function () { location.reload(); };
          document.body.appendChild(box);
        }
        // Only report when the app is not on screen (a failed image or font must not cover a working app).
        function empty() { var r = document.getElementById("root"); return !r || !r.firstChild; }
        function later(msg) { setTimeout(function () { if (empty()) show(msg); }, 300); }
        window.addEventListener("error", function (e) {
          if (e.target && e.target !== window && e.target.tagName !== "SCRIPT") return;
          later((e.message || "Hata") + (e.filename ? " @ " + e.filename + ":" + e.lineno : "") + (e.target && e.target.src ? " (yüklenemedi: " + e.target.src + ")" : ""));
        }, true);
        window.addEventListener("unhandledrejection", function (e) { later("Promise: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
        setTimeout(function () {
          if (empty()) show("Uygulama 12 saniyede yüklenemedi (boş ekran).");
        }, 12000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
